[project]
name = "review-loop"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["review_loop*"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]
