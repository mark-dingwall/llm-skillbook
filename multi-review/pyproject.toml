[project]
name = "multi-review"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
  "rich>=13.7",
  "PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["multi_review*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
mr-validate-prompt = "multi_review.cli.validate_prompt:main"
mr-prepare         = "multi_review.cli.prepare:main"
mr-spawn           = "multi_review.cli.spawn:main"
mr-aggregate       = "multi_review.cli.aggregate:main"
mr-write-task-result = "multi_review.cli.write_task_result:main"
mr-build-synth-input = "multi_review.cli.build_synth_input:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
strict = true
files = ["multi_review/core"]
